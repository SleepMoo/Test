function blocked(x,z,r){for(const [cx,cz,w,d] of obstacles){let dx=Math.max(Math.abs(x-cx)-w/2,0),dz=Math.max(Math.abs(z-cz)-d/2,0);if(dx*dx+dz*dz<r*r)return true;}return false;}
const joystick=$('#joystick'),stick=$('#stick');let joyPtr=-1;
function updateJoy(e){const r=joystick.getBoundingClientRect(),dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2,lim=r.width*.35,k=Math.min(1,lim/Math.max(1,Math.hypot(dx,dy)));control.x=clamp(dx*k/lim,-1,1);control.y=clamp(-dy*k/lim,-1,1);stick.style.transform=`translate(${dx*k}px,${dy*k}px)`}
joystick.addEventListener('pointerdown',e=>{e.preventDefault();joyPtr=e.pointerId;joystick.setPointerCapture(e.pointerId);updateJoy(e)});joystick.addEventListener('pointermove',e=>{if(e.pointerId===joyPtr)updateJoy(e)});function endjoy(e){if(e.pointerId!==joyPtr)return;joyPtr=-1;control.x=control.y=0;stick.style.transform='translate(0,0)'}joystick.addEventListener('pointerup',endjoy);joystick.addEventListener('pointercancel',endjoy);
let dragId=-1,dragX=0,dragY=0;canvas.addEventListener('pointerdown',e=>{if(dragId===-1){dragId=e.pointerId;dragX=e.clientX;dragY=e.clientY;canvas.setPointerCapture(e.pointerId)}});canvas.addEventListener('pointermove',e=>{if(e.pointerId===dragId){let dx=e.clientX-dragX,dy=e.clientY-dragY;cam.yaw-=dx*.006;cam.pitch=clamp(cam.pitch+dy*.004,-.13,.90);dragX=e.clientX;dragY=e.clientY}});canvas.addEventListener('pointerup',e=>{if(e.pointerId===dragId)dragId=-1});canvas.addEventListener('pointercancel',e=>{if(e.pointerId===dragId)dragId=-1});
$('#run').addEventListener('pointerdown',e=>{control.run=true;e.currentTarget.classList.add('pressed')});for(const ev of ['pointerup','pointercancel','pointerleave'])$('#run').addEventListener(ev,e=>{control.run=false;e.currentTarget.classList.remove('pressed')});
$('#jump').addEventListener('click',()=>{if(!control.driving&&player.y<=groundAt(player.x,player.z)+.06)player.vy=5.8});
$('#view').addEventListener('click',()=>{cam.dist=cam.dist===10?16:10;cam.pitch=.26});
$('#reset').addEventListener('click',reset);
$('#quality').addEventListener('click',()=>{quality=quality==='auto'?'low':quality==='low'?'high':'auto';$('#quality').textContent='화질: '+({auto:'자동',low:'절전',high:'고급'}[quality]);resize()});
function toggleCar(){if(control.driving){const off=3;player.x=car.x+Math.cos(car.yaw)*off;player.z=car.z+Math.sin(car.yaw)*off;player.y=groundAt(player.x,player.z);player.vy=0;control.driving=false;$('#car').textContent='CAR';return;}let d=Math.hypot(player.x-car.x,player.z-car.z);if(d<11){control.driving=true;$('#car').textContent='EXIT'}else{let h=$('#help');h.textContent='차량 가까이 다가가야 탑승할 수 있습니다.';setTimeout(()=>h.textContent='왼쪽 조이스틱 이동 · 빈 화면 드래그 시점 · CAR 차량 승하차',2500)}}
$('#car').addEventListener('click',toggleCar);
window.addEventListener('keydown',e=>{keys[e.code]=true;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();if(e.code==='KeyE'&&!e.repeat)toggleCar();if(e.code==='Space'&&!e.repeat&&!control.driving&&player.y<=groundAt(player.x,player.z)+.05)player.vy=5.8});window.addEventListener('keyup',e=>keys[e.code]=false);window.addEventListener('contextmenu',e=>e.preventDefault());
let rw=0,rh=0;function resize(){let dpr=Math.min(window.devicePixelRatio||1,quality==='high'?1.55:quality==='low'?.85:1.08);rw=Math.max(1,Math.floor(innerWidth*dpr));rh=Math.max(1,Math.floor(innerHeight*dpr));canvas.width=rw;canvas.height=rh;gl.viewport(0,0,rw,rh);gl.uniformMatrix4fv(loc.uProj,false,perspective(68*Math.PI/180,rw/rh,.38,480));}window.addEventListener('resize',resize);resize();
function advance(dt){let xx=control.x+(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0),yy=control.y+(keys.KeyW||keys.ArrowUp?1:0)-(keys.KeyS||keys.ArrowDown?1:0);xx=clamp(xx,-1,1);yy=clamp(yy,-1,1);let footSpeed=(control.run||keys.ShiftLeft)?10.2:6.3;
if(control.driving){let force=(yy>=0?17:12)*yy;car.speed+=(force-(.75+Math.abs(car.speed)*.045)*car.speed)*dt;car.speed=clamp(car.speed,-11,25);let steer=(xx*1.4)*Math.min(1,Math.abs(car.speed)/5);car.yaw-=steer*dt*Math.sign(car.speed||1);let nx=clamp(car.x-Math.sin(car.yaw)*car.speed*dt,-125,125);
let nz=clamp(car.z-Math.cos(car.yaw)*car.speed*dt,-68,145);
if(!blocked(nx,nz,1.30)){car.x=nx;car.z=nz;}else car.speed*=.42;
car.y+=(groundAt(car.x,car.z)-car.y)*Math.min(1,dt*10);}
else{let speed=footSpeed,ax=Math.sin(cam.yaw),az=Math.cos(cam.yaw);let mx=xx*az-yy*ax,mz=-xx*ax-yy*az,mag=Math.hypot(mx,mz);if(mag>1){mx/=mag;mz/=mag}let nx=player.x+mx*speed*dt, nz=player.z+mz*speed*dt;
if(!blocked(nx,player.z,.40))player.x=nx;
if(!blocked(player.x,nz,.40))player.z=nz;
if(mag>.05)player.yaw=Math.atan2(-mx,-mz);player.x=clamp(player.x,-126,126);player.z=clamp(player.z,-69,142);player.vy-=18*dt;player.y+=player.vy*dt;let floor=groundAt(player.x,player.z);if(player.y<floor){player.y=floor;if(player.vy<0)player.vy=0;}}
let target=control.driving?car:player;$('#speed').textContent=control.driving?Math.round(Math.abs(car.speed)*3.6):Math.round(Math.hypot(xx,yy)*footSpeed*3.6);$('#mode').textContent=control.driving?'운전 중':'도보 탐험';$('#units').textContent='km/h';}
const mini=$('#mini'),mctx=mini.getContext('2d');function drawMinimap(){const w=mini.width,h=mini.height;mctx.clearRect(0,0,w,h);mctx.fillStyle='#19313c';mctx.fillRect(0,0,w,h);mctx.fillStyle='#285c69';mctx.fillRect(0,h*.64,w,h*.36);mctx.fillStyle='#517263';mctx.fillRect(0,0,w,h*.24);mctx.fillStyle='#87908b';mctx.fillRect(0,h*.24,w,h*.4);mctx.strokeStyle='#273b43';mctx.lineWidth=8;mctx.beginPath();mctx.moveTo(w*.5,0);mctx.lineTo(w*.5,h*.64);mctx.moveTo(0,h*.37);mctx.lineTo(w,h*.37);mctx.stroke();mctx.fillStyle='#d1a66e';for(let i=0;i<10;i++)mctx.fillRect(w*.60+(i%5)*11,h*.49+Math.floor(i/5)*13,8,5);const conv=(x,z)=>[w*(x+150)/300,h*(150-z)/280];let c=conv(car.x,car.z),p=conv(player.x,player.z);mctx.fillStyle='#ffd08c';mctx.beginPath();mctx.arc(...c,6,0,Math.PI*2);mctx.fill();mctx.fillStyle='#fff';mctx.beginPath();mctx.arc(...p,4,0,Math.PI*2);mctx.fill();mctx.strokeStyle='#ffffff77';mctx.lineWidth=2;mctx.strokeRect(1,1,w-2,h-2);}
let frames=0;const ID=new Float32Array(T());function loop(now){requestAnimationFrame(loop);let dt=Math.min(.045,(now-last)/1000);last=now;time+=dt;advance(dt);let target=control.driving?car:player;let front=control.driving?car.yaw:cam.yaw;const track=control.driving?13:cam.dist,offX=Math.sin(cam.yaw)*track*Math.cos(cam.pitch),offZ=Math.cos(cam.yaw)*track*Math.cos(cam.pitch);const eye=[target.x+offX,target.y+(control.driving?3.5:2)+track*Math.sin(cam.pitch),target.z+offZ];eye[1]=Math.max(eye[1],groundAt(eye[0],eye[2])+1.25);
gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
if(skyProgram){gl.disable(gl.DEPTH_TEST);gl.depthMask(false);gl.useProgram(skyProgram);gl.uniform1f(skyClock,time);gl.drawArrays(gl.TRIANGLES,0,3);gl.useProgram(program);gl.depthMask(true);gl.enable(gl.DEPTH_TEST);}
gl.uniformMatrix4fv(loc.uView,false,lookAt(eye,[target.x,target.y+(control.driving?1.6:1.4),target.z]));gl.uniform3f(loc.uCamera,...eye);gl.uniform1f(loc.uTime,time);draw(stat,ID);
gl.depthMask(false);draw(staticShadows,ID);draw(carShadow,model([car.x,car.y,car.z],car.yaw));
if(!control.driving)draw(playerShadow,model([player.x,groundAt(player.x,player.z),player.z],player.yaw));
gl.depthMask(true);
draw(carMesh,model([car.x,car.y,car.z],car.yaw));draw(carWheels,model([car.x,car.y,car.z],car.yaw));if(!control.driving)draw(playerMesh,model([player.x,player.y,player.z],player.yaw));
frames++;if(frames%12===0)drawMinimap();}
car.y=groundAt(car.x,car.z);player.y=groundAt(player.x,player.z);resize();requestAnimationFrame(loop);
})();
